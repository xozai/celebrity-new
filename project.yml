name: Celebrity
options:
  bundleIdPrefix: com.xozai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CelebrityCore:
    path: Packages/CelebrityCore
  CelebrityBackend:
    path: Packages/CelebrityBackend
targets:
  Celebrity:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: CelebrityCore
      - package: CelebrityBackend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xozai.CelebrityGame
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Celebrity Celebrity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
