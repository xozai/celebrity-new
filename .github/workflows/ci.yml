name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Swift package tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path Packages/CelebrityCore
      - run: swift test --package-path Packages/CelebrityBackend

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - run: supabase db start
      - run: supabase test db
      - run: bash supabase/tests/concurrency/run.sh

  build:
    name: App build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -scheme Celebrity
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
