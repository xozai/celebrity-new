<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Game — Celebrity Celebrity</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .logo {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .description {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    .code-box {
      background-color: #0b1120;
      border: 2px dashed var(--accent);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 2rem;
    }
    .code-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .code-value {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 0.9rem;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 0.75rem;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-primary {
      background-color: var(--accent);
      color: #000;
      border: none;
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }
    .help-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎭</div>
    <h1>You're Invited!</h1>
    <p class="description">Join the game in Celebrity Celebrity on iOS.</p>

    <div class="code-box" id="codeBox" style="display: none;">
      <div class="code-label">Room Code</div>
      <div class="code-value" id="roomCode">----</div>
    </div>

    <a href="#" id="openAppBtn" class="btn btn-primary" style="display: none;">
      Open in Celebrity Celebrity
    </a>

    <a href="APP_STORE_URL" class="btn btn-secondary">
      Download on the App Store
    </a>

    <p class="help-text">
      Celebrity Celebrity requires iOS 17 or later on iPhone. If you already have the app installed, enter the room code to join.
    </p>
  </div>

  <script>
    (function() {
      // Extract room code from path /join/CODE or ?code=CODE
      var path = window.location.pathname;
      var match = path.match(/\/join\/([A-Za-z0-9]{4})/i);
      var code = match ? match[1].toUpperCase() : null;

      if (!code) {
        var params = new URLSearchParams(window.location.search);
        code = params.get('code');
        if (code) {
          code = code.toUpperCase().trim();
        }
      }

      if (code) {
        var roomCodeEl = document.getElementById('roomCode');
        var codeBoxEl = document.getElementById('codeBox');
        var openAppBtn = document.getElementById('openAppBtn');

        roomCodeEl.textContent = code;
        codeBoxEl.style.display = 'block';

        // Deep link custom scheme
        var appUrl = 'celebrity://join/' + code;
        openAppBtn.href = appUrl;
        openAppBtn.style.display = 'block';

        // Attempt redirect to app if on iOS
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
          window.location.href = appUrl;
        }
      }
    })();
  </script>
</body>
</html>
